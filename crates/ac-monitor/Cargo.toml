[package]
name = "ac-monitor"
description = "Monitor mode: a virtual Hyprland output captured, encoded and sent to a phone, with touch as the PC's pointer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json = "1"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "event"] }

[dev-dependencies]
tracing-subscriber.workspace = true
